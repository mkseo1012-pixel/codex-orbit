<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Codex Orbit One-Liner</title><style>body{margin:0;background:#0d1117;color:#e6edf3;font:14px system-ui}header{padding:18px 22px;border-bottom:1px solid #30363d;display:flex;justify-content:space-between}h1{margin:0;color:#a78bfa}.app{display:grid;grid-template-columns:240px 1fr 290px;min-height:calc(100vh - 61px)}aside,main,section{padding:18px;border-right:1px solid #30363d}.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:13px;margin:10px 0}textarea,input,select,button{box-sizing:border-box;width:100%;padding:10px;margin:4px 0;background:#0d1117;color:#e6edf3;border:1px solid #484f58;border-radius:8px}button{background:#7c3aed;border:0;cursor:pointer}.muted{color:#8b949e}.msg{border-bottom:1px solid #21262d;padding:9px}.ok{color:#3fb950}</style><header><h1>◈ Codex Orbit</h1><span class=muted>single-file autonomous agent workspace</span></header><div class=app><aside><h3>New goal</h3><textarea id=g placeholder="예: SNS 계정을 성장시켜 수익 만들기"></textarea><label class=muted>Model</label><select id=m><option>gpt-5-codex</option><option>local-model</option><option>openai-compatible</option></select><input id=t type=number value=20000 placeholder="Token limit"><input id=mins type=number value=60 placeholder="Work minutes"><input id=report type=number value=10 placeholder="Report every minutes"><button onclick=start()>Start autonomous run</button><p class=muted>실제 Codex 연결은 보안상 브라우저가 아닌 백엔드에서 처리합니다.</p></aside><main><h2>Runs</h2><div id=runs><p class=muted>No runs yet</p></div><h2>Live activity</h2><div id=log></div></main><section><h2>Approvals</h2><p class=muted>로그인·계정 생성·게시·결제·삭제</p><div id=apps><p class=muted>없음</p></div><h2>Agents</h2><div id=agents></div></section></div><script>let R=[],A=[],L=[],P=[];const id=()=>Math.random().toString(36).slice(2),paint=()=>{runs.innerHTML=R.map(x=>`<div class=card><b>${x.goal}</b><br><span class=muted>${x.status} · ${x.steps} steps · ${x.model} · ${x.tokens}/${x.limit} tokens</span><button onclick="stop('${x.id}')">Stop</button></div>`).join('')||'<p class=muted>No runs yet</p>';log.innerHTML=L.slice(-30).reverse().map(x=>`<div class=msg><b>${x.role}</b> ${x.text}<small class=muted> · ${x.at}</small></div>`).join('');apps.innerHTML=P.filter(x=>x.status=='pending').map(x=>`<div class=card>${x.action}<button onclick="decide('${x.id}','approved')">Approve</button><button onclick="decide('${x.id}','rejected')">Reject</button></div>`).join('')||'<p class=muted>없음</p>';agents.innerHTML=A.map(x=>`<div>↳ ${x.role} <span class=muted>(${x.status})</span></div>`).join('')},say=(role,text)=>{L.push({role,text,at:new Date().toLocaleTimeString()});paint()},start=async()=>{if(!g.value.trim())return alert('목표를 입력하세요');let x={id:id(),goal:g.value,model:m.value,limit:+t.value||2e4,tokens:0,steps:0,status:'running',started:Date.now()};R.push(x);A.push({role:'planner',status:'working'});say('planner','목표를 분석하고 실행 계획을 만들었습니다.');g.value='';paint();let tick=async()=>{if(x.status!='running')return;x.steps++;x.tokens+=Math.min(800,x.limit-x.tokens);say('planner',`다음 작업을 수행 중입니다: ${x.goal}`);if(x.steps%3==0){let role=['researcher','content-agent','analyst'][x.steps/3%3|0];A.push({role,status:'working'});say('planner',`${role} 서브 에이전트에게 업무를 위임했습니다.`)}if(x.steps%5==0){let p={id:id(),action:'외부 계정 로그인 또는 게시 승인',status:'pending'};P.push(p);say('system','승인 대기 작업이 생성되었습니다.')}if(x.tokens>=x.limit){x.status='token limit reached';say('system','토큰 한도에 도달했습니다.')}paint();if(x.status=='running')x.timer=setTimeout(tick,(+report.value||10)*1000)};tick()},stop=i=>{let x=R.find(x=>x.id==i);if(x){x.status='stopped';clearTimeout(x.timer);say('system','실행을 중지했습니다.');paint()}},decide=(i,d)=>{let x=P.find(x=>x.id==i);if(x){x.status=d;say('system',`${x.action}: ${d}`);paint()}};paint()</script>
