<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codex Orbit</title>
<style>
body{margin:0;background:#0f1117;color:#e8eaf0;font:14px system-ui}header{padding:18px 24px;border-bottom:1px solid #292d38;display:flex;justify-content:space-between}.app{display:grid;grid-template-columns:280px 1fr 330px;min-height:calc(100vh - 64px)}aside,main,section{padding:20px;border-right:1px solid #292d38}h1{margin:0;color:#9b8cff}.card{background:#181b24;border:1px solid #292d38;border-radius:12px;padding:14px;margin:10px 0}input,textarea,select,button{background:#10131a;color:#fff;border:1px solid #3b4050;border-radius:8px;padding:10px;margin:4px 0;width:100%;box-sizing:border-box}textarea{height:70px}button{cursor:pointer;background:#6256d9}.muted{color:#8d94a6}.msg{padding:8px;border-bottom:1px solid #252936}.grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}.check{display:flex;gap:6px;align-items:center;color:#b8bfce}.check input{width:auto}.danger{color:#ff7b72}
</style>
<header><h1>Codex Orbit</h1><span class="muted">Autonomous agent workspace · English UI</span></header>
<div class="app"><aside><h3>New goal</h3><textarea id="goal" placeholder="Example: Grow a social media account"></textarea><select id="model"><option>gpt-5-codex</option><option>local-model</option><option>openai-compatible</option></select><div class="grid"><input id="tokens" type="number" value="20000" placeholder="Token limit"><input id="minutes" type="number" value="60" placeholder="Work minutes"></div><button onclick="start()">Start agent</button><hr><h3>Schedule a goal</h3><input id="scheduleGoal" placeholder="Scheduled goal"><input id="cron" value="*/10 * * * *" placeholder="Cron, e.g. */10 * * * *"><button onclick="scheduleGoal()">Create schedule</button><div id="schedules"></div></aside><main><h2>Runs</h2><div id="runs"></div><h2>Live activity</h2><div id="messages"></div></main><section><h2>Approvals</h2><p class="muted">High-impact actions require approval.</p><div id="approvals"></div><h2>Permissions</h2><div class="card"><label class="check"><input id="browser" type="checkbox" checked> Browser automation</label><label class="check"><input id="network" type="checkbox" checked> Network access</label><label class="check"><input id="subagents" type="checkbox" checked> Create sub-agents</label><label class="check"><input id="login" type="checkbox"> Login</label><label class="check"><input id="accountCreation" type="checkbox"> Account creation</label><label class="check"><input id="publishing" type="checkbox"> Publishing</label><label class="check"><input id="payments" type="checkbox"> Payments</label><label class="check danger"><input id="destructive" type="checkbox"> Destructive actions</label><select id="filesystem"><option value="workspace">Workspace files</option><option value="read-only">Read-only files</option><option value="none">No file access</option></select></div><h2>Agent tree</h2><div id="agents"></div></section></div>
<script>
const $=id=>document.getElementById(id),permissions=()=>Object.fromEntries(['browser','network','subagents','login','accountCreation','publishing','payments','destructive'].map(k=>[k,$(k).checked]).concat([['filesystem',$('filesystem').value]]));
async function state(){const x=await fetch('/api/state').then(r=>r.json());$('runs').innerHTML=x.runs.map(r=>`<div class=card><b>${escapeHtml(r.goal)}</b><br><span class=muted>${r.status} · ${r.iterations} steps · ${r.model}</span><button onclick="stop('${r.id}')">Stop</button></div>`).join('')||'<p class=muted>No runs</p>';$('messages').innerHTML=x.messages.slice().reverse().map(m=>`<div class=msg><b>${escapeHtml(m.agentId.split(':')[1])}</b> ${escapeHtml(m.text)}</div>`).join('');$('approvals').innerHTML=x.approvals.filter(a=>a.status==='pending').map(a=>`<div class=card>${escapeHtml(a.action)}<button onclick="decide('${a.id}','approved')">Approve</button><button onclick="decide('${a.id}','rejected')">Reject</button></div>`).join('')||'<p class=muted>None</p>';$('agents').innerHTML=x.agents.map(a=>`<div>↳ ${escapeHtml(a.role)} · ${a.status}</div>`).join('');const schedules=await fetch('/api/schedules').then(r=>r.json());$('schedules').innerHTML=schedules.map(s=>`<div class=card><small>${escapeHtml(s.goal)}<br>${escapeHtml(s.cron)}</small><button onclick="removeSchedule('${s.id}')">Remove</button></div>`).join('')||'<p class=muted>No schedules</p>'}
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function start(){if(!$('goal').value.trim())return;await fetch('/api/runs',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({goal:$('goal').value,model:$('model').value,tokenLimit:+$('tokens').value,minutes:+$('minutes').value,permissions:permissions()})});$('goal').value='';state()}
async function stop(id){await fetch('/api/runs/'+id+'/stop',{method:'POST'});state()}async function decide(id,decision){await fetch('/api/approvals/'+id,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({decision})});state()}async function scheduleGoal(){if(!$('scheduleGoal').value.trim())return;await fetch('/api/schedules',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({goal:$('scheduleGoal').value,cron:$('cron').value,model:$('model').value,tokenLimit:+$('tokens').value,minutes:+$('minutes').value,permissions:permissions()})});$('scheduleGoal').value='';state()}async function removeSchedule(id){await fetch('/api/schedules/'+id,{method:'DELETE'});state()}state();setInterval(state,3000)
</script>
