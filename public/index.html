<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex Orbit</title>
<style>body{margin:0;background:#0f1117;color:#e8eaf0;font:14px system-ui}header{padding:18px 24px;border-bottom:1px solid #292d38;display:flex;justify-content:space-between}.app{display:grid;grid-template-columns:240px 1fr 300px;min-height:calc(100vh - 64px)}aside,main,section{padding:20px;border-right:1px solid #292d38}h1{margin:0;color:#9b8cff}.card{background:#181b24;border:1px solid #292d38;border-radius:12px;padding:14px;margin:10px 0}input,textarea,select,button{background:#10131a;color:#fff;border:1px solid #3b4050;border-radius:8px;padding:10px;margin:4px}textarea{width:90%;height:70px}button{cursor:pointer;background:#6256d9}.muted{color:#8d94a6}.msg{padding:8px;border-bottom:1px solid #252936}</style>
<header><h1>Codex Orbit</h1><span class="muted">Autonomous workspaces · local-first</span></header><div class="app"><aside><h3>Workspace</h3><div>🏠 Overview</div><div>🤖 Agents</div><div>💬 Conversations</div><div>📌 Board</div><div>✅ Approvals</div><hr><h3>New goal</h3><textarea id="goal" placeholder="Example: Grow a social media account"></textarea><input id="tokens" type="number" value="20000" placeholder="Token limit"><input id="minutes" type="number" value="60" placeholder="Work time (minutes)"><button onclick="start()">Start agent</button></aside><main><h2>Runs</h2><div id="runs"></div><h2>Activity</h2><div id="messages"></div></main><section><h2>Approvals</h2><p class="muted">Approve logins, account creation, publishing, payments, and deletion here.</p><div id="approvals"></div><h2>Agent tree</h2><div id="agents"></div></section></div>
<script>async function state(){let x=await fetch('/api/state').then(r=>r.json());runs.innerHTML=x.runs.map(r=>`<div class=card><b>${r.goal}</b><br><span class=muted>${r.status} · ${r.iterations} steps · ${r.model}</span> <button onclick="stop('${r.id}')">Stop</button></div>`).join('')||'<p class=muted>No runs</p>';messages.innerHTML=x.messages.slice().reverse().map(m=>`<div class=msg><b>${m.agentId.split(':')[1]}</b> ${m.text}</div>`).join('');approvals.innerHTML=x.approvals.filter(a=>a.status==='pending').map(a=>`<div class=card>${a.action}<br><button onclick="decide('${a.id}','approved')">Approve</button><button onclick="decide('${a.id}','rejected')">Reject</button></div>`).join('')||'<p class=muted>None</p>';agents.innerHTML=x.agents.map(a=>`<div>↳ ${a.role} · ${a.status}</div>`).join('')}async function start(){await fetch('/api/runs',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({goal:goal.value,tokenLimit:+tokens.value,minutes:+minutes.value})});goal.value='';state()}async function stop(id){await fetch('/api/runs/'+id+'/stop',{method:'POST'});state()}async function decide(id,decision){await fetch('/api/approvals/'+id,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({decision})});state()}state();setInterval(state,3000)</script>
